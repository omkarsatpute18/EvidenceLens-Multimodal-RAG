[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencelens"
version = "0.3.0"
description = "Inspectable multimodal evidence intelligence for documents, tables, and images."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.5",
  "python-multipart==0.0.20",
  "pandas==2.2.3",
  "openpyxl==3.1.5",
  "PyMuPDF==1.25.3",
  "Pillow==11.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
